<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>FEMIN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Outfit:wght@400;500;600&family=Rubik:wght@400;500&display=swap"
    />
    <script>
      // Восстанавливает исходный маршрут после 404-редиректа на GitHub Pages до монтирования React
      (function () {
        try {
          var redirectUrl = window.sessionStorage.getItem("gh_pages_redirect");
          if (redirectUrl) {
            window.sessionStorage.removeItem("gh_pages_redirect");
            if (redirectUrl.charAt(0) === "/" && redirectUrl.charAt(1) !== "/") {
              window.history.replaceState(null, "", redirectUrl);
            }
          }
        } catch {
          // Игнорируем ошибку доступа к sessionStorage
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
